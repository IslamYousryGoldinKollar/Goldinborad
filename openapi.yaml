openapi: 3.1.0
info:
  title: Goldinkollar API
  version: 1.2.0
  description: 'Contract-first API for the Goldinkollar onboarding platform.

    Canonical UI mappings are in ROUTES.md and CLICKMAP.md.

    '
servers:
- url: https://api.example.com
security:
- bearerAuth: []
tags:
- name: Auth
- name: Me
- name: Learner
- name: Knowledge
- name: SelfAwareness
- name: Points
- name: Leaderboard
- name: Rewards
- name: Manager
- name: Admin
- name: Uploads
- name: AIConcierge
- name: AIBuilder
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UUID:
      type: string
      description: UUID string (app may generate UUIDv7)
      examples:
      - 0193b7f2-aaaa-bbbb-cccc-111111111111
    ErrorResponse:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          examples:
          - ERR.AUTH.DOMAIN_NOT_ALLOWED
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Me:
      type: object
      required:
      - user_id
      - tenant_id
      - email
      - roles
      - language
      - timezone
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        tenant_id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        language:
          type: string
          enum:
          - en
          - ar
        timezone:
          type: string
          examples:
          - Asia/Riyadh
          - UTC
        points_balance:
          type: integer
          examples:
          - 120
        is_manager:
          type: boolean
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
    TodayPlan:
      type: object
      required:
      - date
      - tasks
      properties:
        date:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/UserMissionSummary'
    UserMissionSummary:
      type: object
      required:
      - user_mission_id
      - title
      - due_date
      - mission_type
      - completion_mode
      - points
      properties:
        user_mission_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        due_date:
          type: string
          format: date
        mission_type:
          type: string
          enum:
          - digital
          - physical
          - physical_task
          - microlearning_task
        completion_mode:
          type: string
          enum:
          - system_tracked
          - user_attestation_trusted
          - manager_approval
        points:
          type: integer
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - completed
          - overdue
          - revoked
    UserMissionDetail:
      type: object
      required:
      - user_mission_id
      - title
      - description
      - steps
      - mission_type
      - completion_mode
      - points
      - status
      properties:
        user_mission_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
        mission_type:
          type: string
          enum:
          - digital
          - physical
          - physical_task
          - microlearning_task
        completion_mode:
          type: string
          enum:
          - system_tracked
          - user_attestation_trusted
          - manager_approval
        points:
          type: integer
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - completed
          - overdue
          - revoked
        due_date:
          type: string
          format: date
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MissionStep'
        evidence_requirements:
          type: object
          properties:
            photo_required:
              type: boolean
            note_required:
              type: boolean
            allowed_attachment_types:
              type: array
              items:
                type: string
    MissionStep:
      type: object
      required:
      - step_id
      - step_type
      - title
      - status
      properties:
        step_id:
          $ref: '#/components/schemas/UUID'
        step_type:
          type: string
          enum:
          - video_asset
          - article_asset
          - pdf_asset
          - quiz
          - flashcards
          - attestation
        title:
          type: string
        asset_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - completed
        completion_rules:
          type: object
          properties:
            video_watch_threshold:
              type: number
              minimum: 0
              maximum: 1
              examples:
              - 0.8
    KnowledgeAsset:
      type: object
      required:
      - asset_id
      - title
      - asset_type
      - language
      - published
      properties:
        asset_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
          nullable: true
        asset_type:
          type: string
          enum:
          - video
          - article
          - pdf
          - flashcards
        language:
          type: string
          enum:
          - en
          - ar
        published:
          type: boolean
        duration_seconds:
          type: integer
          nullable: true
        download_allowed:
          type: boolean
        governance_status:
          type: string
          description: Draft/review/published state for admin governance
          enum:
          - draft
          - in_review
          - published
          - archived
          nullable: true
        uploaded_by:
          $ref: '#/components/schemas/UUID'
        source_upload_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        poster_upload_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        transcode_status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - failed
          nullable: true
        transcript_status:
          type: string
          enum:
          - not_requested
          - queued
          - processing
          - complete
          - failed
          nullable: true
        audit_trail:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
          nullable: true
    KnowledgeAssetAdminRequest:
      type: object
      required:
      - title
      - asset_type
      - language
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        asset_type:
          type: string
          enum:
          - video
          - article
          - pdf
          - flashcards
        language:
          type: string
          enum:
          - en
          - ar
        download_allowed:
          type: boolean
        source_upload_id:
          $ref: '#/components/schemas/UUID'
        poster_upload_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        publish:
          type: boolean
          description: If true, publishes immediately after validation
          nullable: true
    UploadCreateRequest:
      type: object
      required:
      - file_name
      - mime_type
      - size_bytes
      properties:
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
    UploadCreateResponse:
      type: object
      required:
      - upload_id
      - upload_url
      - headers
      properties:
        upload_id:
          $ref: '#/components/schemas/UUID'
        upload_url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    UploadFinalizeRequest:
      type: object
      required:
      - upload_id
      - purpose
      properties:
        upload_id:
          $ref: '#/components/schemas/UUID'
        purpose:
          type: string
          description: Context for processing the upload
          enum:
          - knowledge_video
          - knowledge_document
          - ai_voice_note
          - evidence
        language:
          type: string
          enum:
          - en
          - ar
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        checksum_md5:
          type: string
          nullable: true
        entity_type:
          type: string
          description: Optional entity linkage for audit/logging
          nullable: true
        entity_id:
          $ref: '#/components/schemas/UUID'
        retry_transcode:
          type: boolean
          description: Force a re-queue of transcoding if applicable
          nullable: true
    UploadFinalizeResponse:
      type: object
      required:
      - upload_id
      - storage_key
      properties:
        upload_id:
          $ref: '#/components/schemas/UUID'
        storage_key:
          type: string
        transcode_job_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        stt_job_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        download_url:
          allOf:
          - $ref: '#/components/schemas/SignedUrlResponse'
          nullable: true
    PointsTransaction:
      type: object
      required:
      - tx_id
      - created_at
      - delta
      - balance_after
      - reason_type
      properties:
        tx_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time
        delta:
          type: integer
        balance_after:
          type: integer
        reason_type:
          type: string
          enum:
          - mission_complete
          - knowledge_complete
          - assessment_complete
          - claim_revoke
          - reward_redeem
          - admin_adjust
          - reversal
        ref_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - active
          - reversed
        reversal_of_tx_id:
          allOf:
          - $ref: '#/components/schemas/UUID'
          nullable: true
    AuditLogEntry:
      type: object
      required:
      - audit_id
      - actor_id
      - action
      - created_at
      properties:
        audit_id:
          $ref: '#/components/schemas/UUID'
        actor_id:
          $ref: '#/components/schemas/UUID'
        action:
          type: string
        target_type:
          type: string
          nullable: true
        target_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
    LeaderboardEntry:
      type: object
      required:
      - user_id
      - display_name
      - points_earned
      - rank
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        display_name:
          type: string
        points_earned:
          type: integer
        rank:
          type: integer
    LeaderboardResponse:
      type: object
      required:
      - timeframe
      - scope
      - entries
      - my_rank
      properties:
        timeframe:
          type: string
          enum:
          - weekly
          - monthly
          - all_time
        scope:
          type: string
          enum:
          - tenant
          - cohort
          - team
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        my_rank:
          type: object
          properties:
            rank:
              type: integer
            points_earned:
              type: integer
    RewardItem:
      type: object
      required:
      - reward_id
      - title
      - cost_points
      - in_stock
      - published
      properties:
        reward_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
          nullable: true
        cost_points:
          type: integer
        in_stock:
          type: boolean
        stock_count:
          type: integer
          nullable: true
        published:
          type: boolean
    RewardRedemption:
      type: object
      required:
      - redemption_id
      - reward_id
      - status
      - created_at
      - cost_points
      properties:
        redemption_id:
          $ref: '#/components/schemas/UUID'
        reward_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - pending
          - fulfilled
          - rejected
          - cancelled
        created_at:
          type: string
          format: date-time
        cost_points:
          type: integer
        notes:
          type: string
          nullable: true
    TaskClaim:
      type: object
      required:
      - claim_id
      - user_mission_id
      - user_id
      - status
      - created_at
      properties:
        claim_id:
          $ref: '#/components/schemas/UUID'
        user_mission_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        note:
          type: string
          nullable: true
        evidence_upload_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - unreviewed
          - kept
          - revoked
        reviewed_by:
          allOf:
          - $ref: '#/components/schemas/UUID'
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        revoke_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    LeaderboardPolicy:
      type: object
      required:
      - leaderboard_enabled
      - timeframes_enabled
      - scopes_enabled
      - privacy_mode
      - allow_user_opt_out
      - default_scope
      - default_timeframe
      properties:
        leaderboard_enabled:
          type: boolean
        timeframes_enabled:
          type: array
          items:
            type: string
            enum:
            - weekly
            - monthly
            - all_time
        scopes_enabled:
          type: array
          items:
            type: string
            enum:
            - tenant
            - cohort
            - team
        privacy_mode:
          type: string
          enum:
          - full_name
          - first_name_last_initial
          - nickname_only
        allow_user_opt_out:
          type: boolean
        default_scope:
          type: string
          enum:
          - tenant
          - cohort
          - team
        default_timeframe:
          type: string
          enum:
          - weekly
          - monthly
          - all_time
    ContinueResponse:
      type: object
      required:
      - next_mission
      properties:
        next_mission:
          $ref: '#/components/schemas/UserMissionSummary'
    SignedUrlResponse:
      type: object
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    IssueReportRequest:
      type: object
      required:
      - user_mission_id
      - message
      properties:
        user_mission_id:
          $ref: '#/components/schemas/UUID'
        category:
          type: string
          nullable: true
        message:
          type: string
    SelfAwarenessAssessment:
      type: object
      required:
      - assessment_id
      - title
      - language
      - published
      properties:
        assessment_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        language:
          type: string
          enum:
          - en
          - ar
        published:
          type: boolean
    SelfAwarenessInstance:
      type: object
      required:
      - instance_id
      - assessment_id
      - version_index
      - status
      - started_at
      properties:
        instance_id:
          $ref: '#/components/schemas/UUID'
        assessment_id:
          $ref: '#/components/schemas/UUID'
        version_index:
          type: integer
        status:
          type: string
          enum:
          - in_progress
          - completed
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        result_json:
          type: object
          additionalProperties: true
          nullable: true
    SelfAwarenessStartResponse:
      type: object
      required:
      - instance
      properties:
        instance:
          $ref: '#/components/schemas/SelfAwarenessInstance'
    SelfAwarenessAnswerRequest:
      type: object
      required:
      - question_key
      - answer_value
      properties:
        question_key:
          type: string
        answer_value:
          type: object
          additionalProperties: true
    SelfAwarenessHolisticResponse:
      type: object
      required:
      - based_on_instances
      - summary
      properties:
        based_on_instances:
          type: array
          items:
            $ref: '#/components/schemas/SelfAwarenessInstance'
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string
          nullable: true
    SelfAwarenessSettingsPatch:
      type: object
      properties:
        consent_personalize:
          type: boolean
        consent_share_manager:
          type: boolean
    SelfAwarenessSummaryJob:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - queued
          - processing
          - complete
          - failed
        language:
          type: string
          enum:
          - en
          - ar
          nullable: true
        holistic:
          $ref: '#/components/schemas/SelfAwarenessHolisticResponse'
          nullable: true
    ConciergeMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
        locale:
          type: string
          enum:
          - en
          - ar
          nullable: true
    ConciergeTurnResponse:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConciergeMessage'
        suggested_actions:
          type: array
          items:
            type: string
          nullable: true
    AiBuilderJob:
      type: object
      required:
      - job_id
      - status
      - created_at
      properties:
        job_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
          - created
          - stt_running
          - ready_for_inventory
          - inventory_ready
          - blueprint_ready
          - failed
        input_upload_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          nullable: true
        voice_upload_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        stt_language:
          type: string
          enum:
          - en
          - ar
          nullable: true
        transcript_text:
          type: string
          nullable: true
        inventory_json:
          type: object
          additionalProperties: true
          nullable: true
        blueprint_json:
          type: object
          additionalProperties: true
          nullable: true
        created_by:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AiBuilderInputRequest:
      type: object
      required:
      - prompt
      properties:
        prompt:
          type: string
        input_upload_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        voice_upload_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        target_language:
          type: string
          enum:
          - en
          - ar
          nullable: true
        journey_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
paths:
  /v1/auth/login:
    post:
      tags:
      - Auth
      operationId: API-AUTH-LOGIN
      summary: Login with email/password (domain restricted)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - me
                properties:
                  access_token:
                    type: string
                  me:
                    $ref: '#/components/schemas/Me'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Domain not allowed / user disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/refresh:
    post:
      tags:
      - Auth
      operationId: API-AUTH-REFRESH
      summary: Refresh access token (refresh cookie)
      security: []
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                properties:
                  access_token:
                    type: string
  /v1/me:
    get:
      tags:
      - Me
      operationId: API-ME-GET
      summary: Get current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
    patch:
      tags:
      - Me
      operationId: API-ME-PATCH
      summary: Update profile/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                language:
                  type: string
                  enum:
                  - en
                  - ar
                timezone:
                  type: string
                profile_photo_upload_id:
                  $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /v1/uploads:
    post:
      tags:
      - Uploads
      operationId: API-UPLOADS-CREATE
      summary: Create an upload and return a signed URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
      responses:
        '200':
          description: Upload created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreateResponse'
  /v1/uploads/{upload_id}/finalize:
    post:
      tags:
      - Uploads
      operationId: API-UPLOADS-FINALIZE
      summary: Finalize an upload (persist + schedule processing)
      parameters:
      - in: path
        name: upload_id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFinalizeRequest'
      responses:
        '200':
          description: Finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFinalizeResponse'
  /v1/uploads/{upload_id}/download:
    get:
      tags:
      - Uploads
      operationId: API-UPLOADS-DOWNLOAD
      summary: Get a signed download URL for a stored object
      parameters:
      - in: path
        name: upload_id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
  /v1/today_plan:
    get:
      tags:
      - Learner
      operationId: API-LRN-TODAY-GET
      summary: Get today's plan (tasks)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayPlan'
  /v1/user_missions/{user_mission_id}:
    get:
      tags:
      - Learner
      operationId: API-LRN-UM-GET
      summary: Get mission detail
      parameters:
      - in: path
        name: user_mission_id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMissionDetail'
  /v1/user_missions/{user_mission_id}/complete:
    post:
      tags:
      - Learner
